  /* ---------------- バスケノート ---------------- */
  window.showNotebook = function(){ stopTickers(); state.screen='notebook'; state.noteDraft=''; state.notebookFilter='all'; render(); };
  window.updateNoteDraft = function(v){ state.noteDraft = v; };
  window.setNotebookFilter = function(f){ state.notebookFilter = f; render(); };
  window.addNote = function(){
    if(!state.profile){ window.showProfileGate(); return; }
    var text = (state.noteDraft||'').trim();
    if(!text) return;
    var notes = state.profile.notes.slice();
    notes.push({id: genId(), text: text, at: new Date().toISOString(), reactions: {}, resolved: false});
    if(notes.length > 200) notes = notes.slice(notes.length - 200);
    state.profile.notes = notes;
    state.noteDraft = '';
    render();
    persistProfile();
  };
  window.deleteNote = function(id){
    if(!state.profile) return;
    state.profile.notes = state.profile.notes.filter(function(n){ return n.id !== id; });
    render();
    persistProfile();
  };
  window.toggleNoteReaction = function(id, emoji){
    if(!state.profile) return;
    var note = state.profile.notes.filter(function(n){ return n.id === id; })[0];
    if(!note) return;
    var reactions = note.reactions || {};
    if(reactions[emoji]) delete reactions[emoji]; else reactions[emoji] = true;
    note.reactions = reactions;
    render();
    persistProfile();
  };
  window.toggleNoteResolved = function(id){
    if(!state.profile) return;
    var note = state.profile.notes.filter(function(n){ return n.id === id; })[0];
    if(!note) return;
    note.resolved = !note.resolved;
    render();
    persistProfile();
  };

  function formatNoteTime(at){
    var d = new Date(at);
    if(isNaN(d)) return '';
    return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  }

  function renderNotebook(){
    if(!state.profile){
      return '<div class="scoreboard"><div class="title">'+pencilIconSVG('currentColor',18)+' バスケノート</div><button class="back-btn" onclick="backToStart()">← もどる</button></div>' +
        '<div class="card"><p class="meta-line">ノートを使うにはプロフィールが必要だよ。 <button class="link-btn" onclick="showProfileGate()">作る/えらぶ</button></p></div>';
    }
    var notes = state.profile.notes || [];
    var filter = state.notebookFilter || 'all';
    var shown = notes.filter(function(n){
      if(filter === 'open') return !n.resolved;
      if(filter === 'resolved') return !!n.resolved;
      return true;
    });
    var bubbles = shown.slice().reverse().map(function(n){
      var reactions = n.reactions || {};
      var activeEmojis = NOTE_STAMPS.filter(function(e){ return reactions[e]; });
      var stampRow = NOTE_STAMPS.map(function(e){
        var active = !!reactions[e];
        return '<button class="note-stamp'+(active?' active':'')+'" onclick="toggleNoteReaction(\''+n.id+'\', \''+e+'\')" aria-label="スタンプ">'+e+'</button>';
      }).join('');
      return '<div class="note-bubble'+(n.resolved?' resolved':'')+'">' +
        '<div class="note-text">'+escapeHtml(n.text).replace(/\n/g,'<br>')+'</div>' +
        (activeEmojis.length ? '<div class="note-reactions-shown">'+activeEmojis.join(' ')+'</div>' : '') +
        '<div class="note-stamp-row">'+stampRow+'</div>' +
        '<div class="note-meta">' +
          '<span>'+formatNoteTime(n.at)+'</span>' +
          '<div class="note-meta-actions">' +
            '<button class="note-resolve'+(n.resolved?' active':'')+'" onclick="toggleNoteResolved(\''+n.id+'\')">'+(n.resolved?'✓ かいけつ!':'かいけつにする')+'</button>' +
            '<button class="note-del" onclick="deleteNote(\''+n.id+'\')" aria-label="削除">×</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('') || '<p class="meta-line">'+(filter==='all' ? 'まだメモがないよ。きょう気づいたこと、コーチに言われたことを書いてみよう。' : 'この絞り込みに合うメモはまだないよ。')+'</p>';
    var tabs = '<div class="filter-tabs notebook-tabs">' +
      '<button class="tab'+(filter==='all'?' active':'')+'" onclick="setNotebookFilter(\'all\')">すべて</button>' +
      '<button class="tab'+(filter==='open'?' active':'')+'" onclick="setNotebookFilter(\'open\')">みちかいけつ</button>' +
      '<button class="tab'+(filter==='resolved'?' active':'')+'" onclick="setNotebookFilter(\'resolved\')">かいけつずみ</button>' +
    '</div>';
    return '<div class="scoreboard"><div class="title">'+pencilIconSVG('currentColor',18)+' バスケノート</div><button class="back-btn" onclick="backToStart()">← もどる</button></div>' +
      '<div class="card notebook-card">' +
        tabs +
        '<div class="notebook-list">'+bubbles+'</div>' +
        '<div class="notebook-input-row">' +
          '<textarea class="text-input notebook-textarea" placeholder="きょうの気づき、練習メモなど…" oninput="updateNoteDraft(this.value)">'+escapeHtml(state.noteDraft)+'</textarea>' +
          '<button class="btn" onclick="addNote()">'+ballIconSVG('#fff',16)+' 追加</button>' +
        '</div>' +
      '</div>';
  }

  /* ---------------- バスケはかせに聞く(AI) ---------------- */
  window.showAskAI = function(){ stopTickers(); state.screen='askAI'; state.askAIError=''; render(); };
  window.updateAskAIQuestion = function(v){ state.askAIQuestion = v; };
  window.submitAskAI = function(){
    var q = (state.askAIQuestion||'').trim();
    if(!q || state.askAILoading) return;
    if(q.length > 300){
      state.askAIError = 'しつもんは300文字いないにしてね。';
      render();
      return;
    }
    state.askAILoading = true;
    state.askAIError = '';
    state.askAIQuestion = '';
    render();
    var historyPayload = state.askAIHistory.slice(-8).map(function(e){ return {q: e.q, a: e.a}; });
    fetch(AI_WORKER_URL, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question: q, history: historyPayload})
    }).then(function(res){
      return res.json().then(function(data){ return {ok: res.ok, data: data}; });
    }).then(function(result){
      state.askAILoading = false;
      if(!result.ok || !result.data || !result.data.answer){
        state.askAIError = 'うまく答えられなかったよ。もう一度きいてみてね。';
        render();
        return;
      }
      var history = state.askAIHistory.slice();
      history.push({
        q: q,
        a: result.data.answer,
        sources: Array.isArray(result.data.sources) ? result.data.sources : []
      });
      if(history.length > 20) history = history.slice(history.length - 20);
      state.askAIHistory = history;
      render();
    }).catch(function(){
      state.askAILoading = false;
      state.askAIError = 'つうしんに失敗したよ。インターネットのせつぞくを確認してね。';
      render();
    });
  };
  window.handleAskAIKeydown = function(event){
    if(event.key === 'Enter' && event.shiftKey){
      event.preventDefault();
      window.submitAskAI();
    }
    // plain Enter (no Shift) inserts a normal newline, so it never fires an
    // accidental submit while the IME is finishing a kana-to-kanji conversion
  };
  window.autoResizeAskAI = function(el){
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 140) + 'px';
  };

  function renderAskAI(){
    var log = state.askAIHistory.map(function(entry){
      var sourcesHtml = (entry.sources && entry.sources.length) ?
        '<div class="ai-source">出典: '+entry.sources.map(function(s){ return escapeHtml(s); }).join('、')+'</div>' : '';
      return '<div class="ai-turn">' +
        '<div class="ai-row ai-row-q"><div class="ai-bubble ai-q">'+escapeHtml(entry.q)+'</div></div>' +
        '<div class="ai-row ai-row-a"><span class="ai-avatar">'+ballIconSVG('#fff',14)+'</span><div><div class="ai-bubble ai-a">'+escapeHtml(entry.a).replace(/\n/g,'<br>')+'</div>'+sourcesHtml+'</div></div>' +
      '</div>';
    }).join('') || (state.askAILoading ? '' : '<p class="meta-line ai-empty">バスケのルールや練習のこと、なんでもきいてみよう!</p>');
    var loadingRow = state.askAILoading ?
      '<div class="ai-turn"><div class="ai-row ai-row-a"><span class="ai-avatar">'+ballIconSVG('#fff',14)+'</span><div class="ai-bubble ai-a ai-loading"><span class="ai-dot"></span><span class="ai-dot"></span><span class="ai-dot"></span></div></div></div>' : '';
    return '<div class="scoreboard"><div class="title">'+askIconSVG('currentColor',18)+' バスケはかせに聞く</div><button class="back-btn" onclick="backToStart()">← もどる</button></div>' +
      '<div class="card ai-card">' +
        '<div class="ai-log" id="ai-log">'+log+loadingRow+'</div>' +
        (state.askAIError ? '<p class="ai-error">'+escapeHtml(state.askAIError)+'</p>' : '') +
        '<div class="ai-input-row">' +
          '<textarea class="text-input ai-textarea" id="ai-textarea" rows="1" placeholder="れい: リバウンドが上手になるには？(Shift+Enterで送信)" oninput="updateAskAIQuestion(this.value); autoResizeAskAI(this);" onkeydown="handleAskAIKeydown(event)">'+escapeHtml(state.askAIQuestion)+'</textarea>' +
          '<button class="btn ai-send-btn" onclick="submitAskAI()" '+(state.askAILoading?'disabled':'')+'>'+askIconSVG('#fff',18)+'</button>' +
        '</div>' +
        '<p class="meta-line ai-disclaimer">AIの答えです。まちがっていることもあるので、大事なルールは審判やコーチにも確認してね。</p>' +
      '</div>';
  }

  /* ---------------- 得点板 ---------------- */
  window.showScoreboardTool = function(){ stopTickers(); state.screen='scoreboardTool'; render(); };
  window.addScore = function(team, pts){
    state.scoreboard[team].score = Math.max(0, state.scoreboard[team].score + pts);
    render();
  };
  window.addFoul = function(team, delta){
    state.scoreboard[team].fouls = Math.max(0, state.scoreboard[team].fouls + delta);
    render();
  };
  window.updateTeamName = function(team, name){ state.scoreboard[team].name = name; };
  window.resetScoreboardTool = function(){
    state.scoreboard = {
      a:{name:state.scoreboard.a.name, score:0, fouls:0},
      b:{name:state.scoreboard.b.name, score:0, fouls:0}
    };
    render();
  };

  function teamBlock(team){
    var t = state.scoreboard[team];
    return '<div class="team-block">' +
      '<input class="text-input team-name-input" value="'+escapeHtml(t.name)+'" oninput="updateTeamName(\''+team+'\', this.value)">' +
      '<div class="team-score">'+t.score+'</div>' +
      '<div class="btn-row score-btn-row">' +
        '<button class="btn small-btn" onclick="addScore(\''+team+'\',1)">+1</button>' +
        '<button class="btn small-btn" onclick="addScore(\''+team+'\',2)">+2</button>' +
        '<button class="btn small-btn" onclick="addScore(\''+team+'\',3)">+3</button>' +
        '<button class="btn btn-ghost small-btn" onclick="addScore(\''+team+'\',-1)">-1</button>' +
      '</div>' +
      '<div class="foul-row">' +
        '<span class="foul-label">チームファウル'+(t.fouls>=4?' <span class="foul-penalty">ペナルティ</span>':'')+'</span>' +
        '<button class="btn-ghost small-btn foul-btn" onclick="addFoul(\''+team+'\',-1)">-</button>' +
        '<span class="foul-count">'+t.fouls+'</span>' +
        '<button class="btn-ghost small-btn foul-btn" onclick="addFoul(\''+team+'\',1)">+</button>' +
      '</div>' +
    '</div>';
  }

  function renderScoreboardTool(){
    return '<div class="scoreboard"><div class="title">'+courtIconSVG('currentColor',18)+' 得点板</div><button class="back-btn" onclick="backToStart()">← もどる</button></div>' +
      '<div class="card">' +
        '<div class="team-grid">'+teamBlock('a')+teamBlock('b')+'</div>' +
        '<div class="start-actions"><button class="btn btn-ghost" onclick="resetScoreboardTool()">スコアをリセット</button></div>' +
        '<p class="meta-line">チームファウルが4個になると「ペナルティ」(相手にボーナスフリースロー)。この画面のデータは保存されません(ページを閉じると消えます)。</p>' +
      '</div>';
  }

  /* ---------------- ストップウォッチ ---------------- */
  window.showStopwatch = function(){ stopTickers(); state.screen='stopwatch'; render(); };
  window.toggleStopwatch = function(){
    var sw = state.stopwatch;
    if(sw.running){
      sw.elapsedMs += Date.now() - sw.startedAt;
      sw.running = false;
      stopTickers();
    } else {
      sw.startedAt = Date.now();
      sw.running = true;
      stopTickers();
      tickHandle = setInterval(render, 250);
    }
    render();
  };
  window.resetStopwatch = function(){
    stopTickers();
    state.stopwatch = {running:false, elapsedMs:0, startedAt:0};
    render();
  };

  function formatElapsed(ms){
    var totalCs = Math.floor(ms/10);
    var cs = totalCs % 100;
    var totalSec = Math.floor(totalCs/100);
    var s = totalSec % 60;
    var m = Math.floor(totalSec/60);
    return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+String(cs).padStart(2,'0');
  }

  function renderStopwatch(){
    var sw = state.stopwatch;
    var live = sw.elapsedMs + (sw.running ? Date.now() - sw.startedAt : 0);
    return '<div class="scoreboard"><div class="title">'+stopwatchIconSVG('currentColor',18)+' ストップウォッチ</div><button class="back-btn" onclick="backToStart()">← もどる</button></div>' +
      '<div class="card timer-card">' +
        '<div class="timer-display">'+formatElapsed(live)+'</div>' +
        '<div class="start-actions">' +
          '<button class="btn" onclick="toggleStopwatch()">'+(sw.running?'ストップ':'スタート')+'</button>' +
          '<button class="btn btn-ghost" onclick="resetStopwatch()">リセット</button>' +
        '</div>' +
      '</div>';
  }

  /* ---------------- タイマー(カウントダウン) ---------------- */
  window.showTimer = function(){ stopTickers(); state.screen='timer'; render(); };
  window.setTimerPreset = function(sec){
    stopTickers();
    state.timer = {running:false, totalSec:sec, remainingSec:sec, finished:false};
    render();
  };
  window.adjustTimerTotal = function(deltaSec){
    if(state.timer.running) return;
    var t = state.timer;
    t.totalSec = Math.max(10, t.totalSec + deltaSec);
    t.remainingSec = t.totalSec;
    t.finished = false;
    render();
  };
  window.toggleTimer = function(){
    var t = state.timer;
    if(t.finished){ t.remainingSec = t.totalSec; t.finished = false; }
    if(t.running){
      t.running = false;
      stopTickers();
    } else {
      t.running = true;
      stopTickers();
      tickHandle = setInterval(function(){
        var tt = state.timer;
        if(!tt.running) return;
        tt.remainingSec -= 1;
        if(tt.remainingSec <= 0){
          tt.remainingSec = 0;
          tt.running = false;
          tt.finished = true;
          stopTickers();
          playTimerBeep();
        }
        render();
      }, 1000);
    }
    render();
  };
  window.resetTimerRun = function(){
    stopTickers();
    var t = state.timer;
    t.remainingSec = t.totalSec;
    t.running = false;
    t.finished = false;
    render();
  };

  function playTimerBeep(){
    try{
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return;
      var ctx = new Ctx();
      [0, 0.35, 0.7].forEach(function(delay){
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.value = 880;
        gain.gain.value = 0.15;
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(ctx.currentTime + delay);
        osc.stop(ctx.currentTime + delay + 0.25);
      });
    }catch(e){}
  }

  function formatSeconds(sec){
    var s = sec % 60;
    var m = Math.floor(sec/60);
    return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  }

  function renderTimer(){
    var t = state.timer;
    var presets = [60,180,300,600];
    var presetBtns = presets.map(function(p){
      return '<button class="btn btn-ghost small-btn'+(t.totalSec===p&&!t.running?' active-preset':'')+'" onclick="setTimerPreset('+p+')">'+formatSeconds(p)+'</button>';
    }).join('');
    return '<div class="scoreboard"><div class="title">'+stopwatchIconSVG('currentColor',18)+' タイマー</div><button class="back-btn" onclick="backToStart()">← もどる</button></div>' +
      '<div class="card timer-card">' +
        '<div class="timer-display'+(t.finished?' timer-finished':'')+'">'+formatSeconds(t.remainingSec)+'</div>' +
        (t.finished ? '<p class="timer-up-msg">タイムアップ!</p>' : '') +
        '<div class="start-actions">' +
          '<button class="btn" onclick="toggleTimer()">'+(t.running?'ストップ':'スタート')+'</button>' +
          '<button class="btn btn-ghost" onclick="resetTimerRun()">リセット</button>' +
        '</div>' +
        '<div class="preset-row">'+presetBtns+
          (t.running?'':'<button class="btn-ghost small-btn" onclick="adjustTimerTotal(-30)">-30秒</button><button class="btn-ghost small-btn" onclick="adjustTimerTotal(30)">+30秒</button>') +
        '</div>' +
      '</div>';
  }

  function renderUpdateBanner(){
    if(!state.updateAvailable) return '';
    return '<div class="update-banner">新しいバージョン(ver'+state.updateAvailable+')が公開されました。' +
      '<button class="banner-link" onclick="showChangelog()">くわしく見る</button>' +
      '<button onclick="location.reload()">更新する</button></div>';
  }

  function renderStorageBanner(){
    if(!state.storageBroken) return '';
    return '<div class="update-banner storage-warn">この端末では保存がうまくできないようです。' +
      'プロフィール作成後、下の「引き継ぎコード」を必ずひかえておいてください。' +
      '</div>';
  }

  /* no db here — check for a newer version by re-fetching this same page (same-origin, no capability needed) */
  function checkForUpdate(){
    if(!(window.fetch)) return;
    fetch(location.href, {cache:'no-store'}).then(function(res){
      return res.ok ? res.text() : null;
    }).then(function(text){
      if(!text) return;
      var m = text.match(/var APP_VERSION\s*=\s*"([^"]+)"/);
      if(m && m[1] && m[1] !== APP_VERSION){
        state.updateAvailable = m[1];
        render();
      } else if(state.updateAvailable){
        state.updateAvailable = null;
        render();
      }
    }).catch(function(){});
  }

  function render(){
    var app = document.getElementById('app');
    var body;
    if(state.screen === 'start') body = renderStart();
    else if(state.screen === 'quiz') body = renderQuiz();
    else if(state.screen === 'glossary') body = renderGlossary();
    else if(state.screen === 'result') body = renderResult();
    else if(state.screen === 'profileGate') body = renderProfileGate();
    else if(state.screen === 'profileEdit') body = renderProfileEdit();
    else if(state.screen === 'profile') body = renderProfile();
    else if(state.screen === 'jishu') body = renderJishu();
    else if(state.screen === 'customdrill-edit') body = renderCustomDrillEdit();
    else if(state.screen === 'customtypes-edit') body = renderCustomTypesEdit();
    else if(state.screen === 'changelog') body = renderChangelog();
    else if(state.screen === 'notebook') body = renderNotebook();
    else if(state.screen === 'scoreboardTool') body = renderScoreboardTool();
    else if(state.screen === 'stopwatch') body = renderStopwatch();
    else if(state.screen === 'timer') body = renderTimer();
    else if(state.screen === 'askAI') body = renderAskAI();
    else if(state.screen === 'terms') body = renderTerms();
    else if(state.screen === 'privacy') body = renderPrivacy();
    else if(state.screen === 'tokushoho') body = renderTokushoho();
    else if(state.screen === 'help') body = renderHelp();
    else if(state.screen === 'weakSummary') body = renderWeakSummary();
    app.innerHTML = renderUpdateBanner() + renderStorageBanner() + body + renderLegalFooter() + renderTutorial() + renderShareCardModal();
    if(state.screen === 'askAI'){
      var aiLog = document.getElementById('ai-log');
      if(aiLog) aiLog.scrollTop = aiLog.scrollHeight;
    }
    if(state.shareCard) drawShareCard();
  }

  initLocalProfile();
  render();
  initDownloadsCapability();

  setTimeout(checkForUpdate, 3000);
  setInterval(checkForUpdate, 10 * 60 * 1000);
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden) checkForUpdate();
  });

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(){});
    });
  }

  initAnalytics();
})();
</script>
</body>
</html>
